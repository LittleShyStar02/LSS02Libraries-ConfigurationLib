name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      # Safety net: never fail the build if gradlew lacks the executable bit in the git index.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Caches Gradle and validates the wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and verify
        run: ./gradlew build

      - name: Check that the POMs can be generated
        run: ./gradlew generatePomFileForMavenPublication
